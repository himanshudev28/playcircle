# Render Blueprint: the whole app (pages + Socket.IO, see server.js) as one
# free web service. Free instances sleep after ~15 min idle and wake on the
# next visit (~50 s); rooms live in memory, so a sleep or deploy resets them.
services:
  - type: web
    name: playcircle
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/ice
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Canonical links / social previews (read at build time).
      - key: NEXT_PUBLIC_SITE_URL
        value: https://playcircle-174u.onrender.com
      # TURN relay for calls and live sharing across networks (see
      # app/api/ice/route.ts): ExpressTURN's free tier. The login is set in
      # the dashboard, never committed.
      - key: TURN_URLS
        value: turn:free.expressturn.com:3478?transport=udp,turn:free.expressturn.com:3478?transport=tcp
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
